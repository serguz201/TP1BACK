[pytest]
testpaths = tests
asyncio_mode = auto

# El engine async de SQLAlchemy ata su pool de conexiones al event loop en que
# se creo. Con un loop por test (el defecto de pytest-asyncio), la segunda
# prueba reutiliza conexiones de un loop ya cerrado y revienta con
# "RuntimeError: Event loop is closed". Un unico loop de sesion mantiene el pool
# valido de principio a fin.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

filterwarnings =
    ignore::DeprecationWarning
