services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jps_freight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jps_freight"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/jps_freight
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ml:/app/ml        # modelo XGBoost accesible sin rebuildar imagen
      - ./alembic:/app/alembic
    restart: unless-stopped

volumes:
  postgres_data:
